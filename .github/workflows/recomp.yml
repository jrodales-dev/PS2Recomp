name: build-and-recomp
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      game_elf_asset_id:
        description: "Release asset ID for game.elf (numeric, e.g. 123456789)"
        required: true
        type: string
      map_csv_asset_id:
        description: "Release asset ID for map.csv (numeric, e.g. 987654321)"
        required: true
        type: string

jobs:
  linux-gcc-clang:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    name: linux-${{ matrix.compiler }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-ccache-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
      - name: Configure ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats
      - name: Show ccache stats (before build)
        run: ccache -s
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc
            export CXX=g++
          else
            export CC=clang
            export CXX=clang++
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --config Release
      - name: Show ccache stats (after build)
        run: ccache -s
      - name: Tests
        run: ./build/ps2xTest/ps2x_tests

  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_arch: x86_64
    name: windows-msvc-${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}
      - name: Build
        shell: cmd
        run: |
          cmake -B build
          cmake --build build --config Release
      - name: Tests
        shell: cmd
        run: .\build\ps2xTest\Release\ps2x_tests.exe
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: PS2Recomp - Windows
          path: |
            build/ps2xAnalyzer/Release/*.exe
            build/ps2xRecomp/Release/*.exe
            build/ps2xTest/Release/*.exe

  recomp-game:
    name: recomp-game
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    needs: windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build tools
        shell: cmd
        run: |
          cmake -B build
          cmake --build build --config Release
      - name: Download game ELF and map CSV from Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path inputs | Out-Null
          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            Accept        = "application/octet-stream"
          }
          $elfUrl = "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.game_elf_asset_id }}"
          $csvUrl = "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.map_csv_asset_id }}"
          Invoke-WebRequest -Uri $elfUrl -Headers $headers -OutFile "inputs\game.elf"
          Invoke-WebRequest -Uri $csvUrl -Headers $headers -OutFile "inputs\map.csv"
      - name: Validate inputs
        shell: pwsh
        run: |
          if (!(Test-Path "inputs\game.elf")) { throw "Missing game ELF after download" }
          if (!(Test-Path "inputs\map.csv")) { throw "Missing map CSV after download" }
      - name: Generate recomp config
        shell: pwsh
          $toml = @(
            '[general]'
            'input = "inputs/game.elf"'
            'ghidra_output = "inputs/map.csv"'
            'output = "recomp_out"'
          ) -join "`n"
          Set-Content -Encoding utf8NoBOM -Path "inputs\recomp.toml" -Value $toml
      - name: Run recomp
        shell: cmd
        run: |
          .\build\ps2xRecomp\Release\ps2_recomp.exe "inputs\recomp.toml"
      - name: Upload recomp output
        uses: actions/upload-artifact@v6
        with:
          name: Recompiled-Game
          path: recomp_out/**

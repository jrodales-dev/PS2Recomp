name: build-and-recomp
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      game_elf_url:
        description: "Direct download URL for the game ELF file (e.g. a Release asset or Gist raw link)"
        required: true
        type: string
      map_csv_url:
        description: "Direct download URL for the map CSV file"
        required: true
        type: string
jobs:
  linux-gcc-clang:
    # ...unchanged...

  windows-msvc:
    # ...unchanged...

  recomp-game:
    name: recomp-game
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    needs: windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build tools
        shell: cmd
        run: |
          cmake -B build
          cmake --build build --config Release
      - name: Download game ELF and map CSV
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path inputs | Out-Null
          Invoke-WebRequest -Uri "${{ inputs.game_elf_url }}" -OutFile "inputs\game.elf"
          Invoke-WebRequest -Uri "${{ inputs.map_csv_url }}" -OutFile "inputs\map.csv"
      - name: Validate inputs
        shell: pwsh
        run: |
          if (!(Test-Path "inputs\game.elf")) { throw "Missing game ELF after download" }
          if (!(Test-Path "inputs\map.csv")) { throw "Missing map CSV after download" }
      - name: Run recomp
        shell: cmd
        run: |
          .\build\ps2xRecomp\Release\ps2xRecomp.exe "inputs\game.elf" "inputs\map.csv" --out .\recomp_out
      - name: Upload recomp output
        uses: actions/upload-artifact@v6
        with:
          name: Recompiled-Game
          path: recomp_out/**

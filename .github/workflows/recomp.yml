name: build-and-recomp

on:
  workflow_dispatch:

jobs:
  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_arch: x86_64
    name: windows-msvc-${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Tests
        shell: cmd
        run: .\build\ps2xTest\Release\ps2x_tests.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2Recomp - Windows
          path: |
            build/ps2xAnalyzer/Release/*.exe
            build/ps2xRecomp/Release/*.exe
            build/ps2xTest/Release/*.exe
            build/ps2xRuntime/Release/*.exe
            

  recomp-game:
    name: recomp-game
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    needs: windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build tools
        shell: cmd
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Download game ELF and map CSV from Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path inputs | Out-Null
          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            Accept        = "application/octet-stream"
          }
          $elfUrl = "https://api.github.com/repos/${{ github.repository }}/releases/assets/514541207"
          $csvUrl = "https://api.github.com/repos/${{ github.repository }}/releases/assets/514541168"
          Invoke-WebRequest -Uri $elfUrl -Headers $headers -OutFile "inputs\game.elf"
          Invoke-WebRequest -Uri $csvUrl -Headers $headers -OutFile "inputs\map.csv"

      - name: Validate inputs
        shell: pwsh
        run: |
          if (!(Test-Path "inputs\game.elf")) { throw "Missing game ELF after download" }
          if (!(Test-Path "inputs\map.csv")) { throw "Missing map CSV after download" }

      - name: Generate recomp config
        shell: pwsh
        run: |
          $toml = @(
            '[general]'
            'input = "inputs/game.elf"'
            'ghidra_output = "inputs/map.csv"'
            'output = "recomp_out"'
          ) -join "`n"
          Set-Content -Encoding utf8NoBOM -Path "inputs\recomp.toml" -Value $toml

      - name: Run recomp
        shell: cmd
        run: |
          .\build\ps2xRecomp\Release\ps2_recomp.exe "inputs\recomp.toml"

      - name: Copy generated source/header files into runtime
        shell: pwsh
        run: |
          if (!(Test-Path "recomp_out")) { throw "Missing recomp_out folder from recomp step" }

          New-Item -ItemType Directory -Force -Path "ps2xRuntime/src/runner" | Out-Null
          New-Item -ItemType Directory -Force -Path "ps2xRuntime/include" | Out-Null

          Get-ChildItem -Path "recomp_out" -Filter "*.cpp" -File | ForEach-Object {
            Copy-Item $_.FullName -Destination "ps2xRuntime/src/runner/" -Force
          }

          Get-ChildItem -Path "recomp_out" -Filter "*.h" -File | ForEach-Object {
            Copy-Item $_.FullName -Destination "ps2xRuntime/include/" -Force
          }

      - name: Configure ps2EntryRunner build
        shell: cmd
        run: |
          cmake -S . -B out/build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_UNITY_BUILD=OFF

      - name: Build ps2EntryRunner (RelWithDebInfo)
        shell: cmd
        run: |
          cmake --build out/build --config RelWithDebInfo --target ps2EntryRunner -- /m

      - name: Verify ps2EntryRunner exists
        shell: pwsh
        run: |
          if (!(Test-Path "out/build/ps2xRuntime/RelWithDebInfo/ps2EntryRunner.exe")) {
            throw "ps2EntryRunner.exe not found at out/build/ps2xRuntime/RelWithDebInfo/ps2EntryRunner.exe"
          }

      - name: Upload ps2EntryRunner artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2EntryRunner-windows
          path: out/build/ps2xRuntime/RelWithDebInfo/ps2EntryRunner.exe

      - name: Upload recomp output
        uses: actions/upload-artifact@v4
        with:
          name: Recompiled-Game
          path: recomp_out/**
